[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rivet-code-agent"
version = "1.9.0"
description = "A small coding agent built from first principles"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
rivet = "rivet.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rivet = [
  "webui/*.html",
  "webui/*.css",
  "webui/*.js",
  "builtin_skills/*/SKILL.md",
  "builtin_skills/*/references/*",
]

